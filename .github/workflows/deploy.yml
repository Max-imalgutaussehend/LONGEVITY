name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to longevity.maxrommel.de
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_SUBMODULE_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/max-imalgutaussehend/longevity-backend:${{ github.sha }}
            ghcr.io/max-imalgutaussehend/longevity-backend:latest
          # Capture digest for pinned image reference (ADR-0011)
          outputs: type=image,name=ghcr.io/max-imalgutaussehend/longevity-backend,push=true

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/max-imalgutaussehend/longevity-frontend:${{ github.sha }}
            ghcr.io/max-imalgutaussehend/longevity-frontend:latest

      - name: Get image digests
        id: digests
        run: |
          API_DIGEST=$(docker buildx imagetools inspect ghcr.io/max-imalgutaussehend/longevity-backend:${{ github.sha }} --format '{{.Manifest.Digest}}')
          WEB_DIGEST=$(docker buildx imagetools inspect ghcr.io/max-imalgutaussehend/longevity-frontend:${{ github.sha }} --format '{{.Manifest.Digest}}')
          echo "api=ghcr.io/max-imalgutaussehend/longevity-backend@${API_DIGEST}" >> $GITHUB_OUTPUT
          echo "web=ghcr.io/max-imalgutaussehend/longevity-frontend@${WEB_DIGEST}" >> $GITHUB_OUTPUT

      - name: Deploy to life-server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            mkdir -p /opt/longevity

            # Deploy compose file (base64-encoded to avoid heredoc issues in ssh-action)
            echo '' | base64 -d > /opt/longevity/compose.prod.yml

            # Fetch shared secrets from life-server .env
            PG_PASS=$(grep ^POSTGRES_LONGEVITY_PASSWORD /opt/life-server/.env | cut -d= -f2)
            SESSION=$(grep ^LONGEVITY_SESSION_SECRET /opt/life-server/.env | cut -d= -f2)
            ENV_PREFIX=$(grep ^ENV_PREFIX_NAME /opt/life-server/.env | cut -d= -f2-)

            # Write longevity-only .env
            printf 'LONGEVITY_API_IMAGE=%s\nLONGEVITY_WEB_IMAGE=%s\nLONGEVITY_COMMIT_SHA=%s\nPOSTGRES_LONGEVITY_PASSWORD=%s\nLONGEVITY_SESSION_SECRET=%s\nENV_PREFIX_NAME=%s\n' \
              '${{ steps.digests.outputs.api }}' \
              '${{ steps.digests.outputs.web }}' \
              '${{ github.sha }}' \
              "$PG_PASS" \
              "$SESSION" \
              "$ENV_PREFIX" \
              > /opt/longevity/.env

            # Ensure Caddy knows about longevity — append if not present
            CADDY_FILE=/opt/life-server/compose/generated/caddy/Caddyfile
            if ! grep -q 'longevity' "$CADDY_FILE"; then
              printf '\n# ── longevity — Health Score App\nlongevity{$ENV_PREFIX}.{$DOMAIN} {\n\treverse_proxy /api/* {$ENV_PREFIX_NAME}longevity-api:3000\n\treverse_proxy * {$ENV_PREFIX_NAME}longevity:80\n}\n' >> "$CADDY_FILE"
              docker exec $(docker ps -qf name=caddy) caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi

            cd /opt/longevity
            COMPOSE="docker compose --env-file .env -f compose.prod.yml"

            $COMPOSE pull

            $COMPOSE run --rm --entrypoint node api dist/db/migrate.js

            $COMPOSE up -d --wait

            curl -fsS --retry 6 --retry-delay 5 \
              https://longevity.maxrommel.de/api/healthz

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/longevity && docker compose --env-file .env -f compose.prod.yml up -d --wait || true
            echo "Rollback attempted"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: ${ENV_PREFIX_NAME:-prod-}longevity-db
    environment:
      POSTGRES_DB: longevity
      POSTGRES_USER: longevity
      POSTGRES_PASSWORD: ${POSTGRES_LONGEVITY_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longevity"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${LONGEVITY_API_IMAGE}
    restart: unless-stopped
    container_name: ${ENV_PREFIX_NAME:-prod-}longevity-api
    environment:
      DATABASE_URL: postgres://longevity:${POSTGRES_LONGEVITY_PASSWORD}@${ENV_PREFIX_NAME:-prod-}longevity-db:5432/longevity
      SESSION_SECRET: ${LONGEVITY_SESSION_SECRET}
      NODE_ENV: production
      COMMIT_SHA: ${LONGEVITY_COMMIT_SHA:-unknown}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://longevity.maxrommel.de}
      GOOGLE_FIT_CLIENT_ID: ${GOOGLE_FIT_CLIENT_ID}
      GOOGLE_FIT_CLIENT_SECRET: ${GOOGLE_FIT_CLIENT_SECRET}
      GOOGLE_HEALTH_CLIENT_ID: ${GOOGLE_HEALTH_CLIENT_ID}
      GOOGLE_HEALTH_CLIENT_SECRET: ${GOOGLE_HEALTH_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET}
      OURA_CLIENT_ID: ${OURA_CLIENT_ID}
      OURA_CLIENT_SECRET: ${OURA_CLIENT_SECRET}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ${LONGEVITY_WEB_IMAGE}
    restart: unless-stopped
    container_name: ${ENV_PREFIX_NAME:-prod-}longevity
    networks:
      - internal
      - edge
    depends_on:
      - api

networks:
  internal:
    internal: true
  edge:
    external: true
    name: longevity-edge

volumes:
  db_data:
